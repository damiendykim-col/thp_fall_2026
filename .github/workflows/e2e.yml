name: End-to-end
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/e2e-readiness.test.mjs
      - name: Start E2E backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run e2e:setup; then
              exit 0
            fi
            echo "E2E backend setup failed on attempt ${attempt}"
            npm run e2e:stop || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "E2E backend could not be started"
          exit 1
      - run: npm run test:e2e
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run e2e:stop
        if: always()
